# Offline tests for every push and pull request (Jev and OpenRouter are faked). Vercel deploys the website.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Relay, page and published engine
        run: |
          node tests/test_relay.js
          node tests/test_build_site.js
          node ui/test_site.js
      - name: Website build
        run: node scripts/build_site.js --no-stars

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Engine tests (parsing, identity, links, repeats, browser loader, reproducibility, Jev client, CLI)
        run: npm test
